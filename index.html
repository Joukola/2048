<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#245b40"><link rel="manifest" href="manifest.json"><title>Siskon parempi 2048</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#397950,#183e2c);color:white;font:18px system-ui;min-height:100dvh}main{max-width:540px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px}button{font:inherit;border:0;border-radius:8px;padding:10px;background:#e4efdf;color:#183e2c;cursor:pointer}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#183e2c;padding:8px;border-radius:12px;touch-action:none;user-select:none}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:clamp(20px,6vw,40px);font-weight:bold;color:#20362b}#menu{position:absolute;right:12px;top:64px;background:#234c36;padding:12px;border-radius:10px;box-shadow:0 4px 20px #0006;z-index:2}#menu button{display:block;width:100%;margin:5px 0}#stats{display:flex;justify-content:space-between;margin:14px 0}#status{min-height:55px;white-space:pre-line}select{font:inherit}</style><main><header><h1 id="title"></h1><button id="toggle" aria-label="Menu">☰</button></header><div id="menu" hidden><button id="new"></button><button id="undo"></button><button id="hint"></button><button id="analysis"></button><button id="auto"></button><select id="lang"><option value="fi">Suomi</option><option value="hu">Magyar</option><option value="en">English</option></select></div><div id="stats"><span id="score"></span><span id="best"></span></div><div id="board"></div><p id="status" aria-live="polite"></p><small>v0.1.0 test</small></main><script>
const $=id=>document.getElementById(id),dict={fi:['Siskon parempi 2048','Uusi peli','Peruuta','Vihje','Analyysi','Automaattipeli','Pysäytä','Pisteet','Ennätys','Ei siirtoja','2048 saavutettu!','Ylös','Oikealle','Alas','Vasemmalle'],hu:['Sisko jobb 2048 játéka','Új játék','Visszavonás','Tipp','Elemzés','Automatikus játék','Leállítás','Pont','Rekord','Nincs több lépés','2048 elérve!','Fel','Jobbra','Le','Balra'],en:["Sisko’s better 2048",'New game','Undo','Hint','Analysis','Auto play','Stop','Score','Best','No moves left','2048 reached!','Up','Right','Down','Left']};let lang=localStorage.getItem('lang')||'fi',b=Array(16).fill(0),score=0,best=Number(localStorage.getItem('best2048'))||0,history=[],timer=null,won=false;const t=()=>dict[lang];function spawn(a){let e=a.map((v,i)=>v? -1:i).filter(i=>i>=0);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function move(a,d){let n=a.slice(),gain=0;for(let j=0;j<4;j++){let ids=Array.from({length:4},(_,k)=>d===0?k*4+j:d===1?j*4+3-k:d===2?(3-k)*4+j:j*4+k),v=ids.map(i=>a[i]).filter(Boolean),out=[];for(let k=0;k<v.length;k++){if(v[k]===v[k+1]){out.push(v[k]*2);gain+=v[k]*2;k++}else out.push(v[k])}ids.forEach((i,k)=>n[i]=out[k]||0)}return {n,gain,changed:n.some((v,i)=>v!==a[i])}}function evaluate(a){let empty=a.filter(v=>!v).length,max=Math.max(...a),smooth=0,merge=0;for(let i=0;i<16;i++)for(let j of [i%4<3?i+1:-1,i<12?i+4:-1])if(j>=0&&a[i]&&a[j]){smooth+=Math.abs(Math.log2(a[i])-Math.log2(a[j]));if(a[i]===a[j])merge++}return empty*28+merge*8-smooth*2+([0,3,12,15].some(i=>a[i]===max)?20:0)}function rank(){return [0,1,2,3].map(d=>{let m=move(b,d);if(!m.changed)return {d,v:-Infinity};let e=m.n.map((v,i)=>v?-1:i).filter(i=>i>=0),sum=0;for(let i of e)for(let [tile,p] of [[2,.9],[4,.1]]){let a=m.n.slice();a[i]=tile;let next=[0,1,2,3].map(k=>move(a,k)).filter(x=>x.changed);sum+=p*(next.length?Math.max(...next.map(x=>evaluate(x.n)+x.gain*.15)):-1000)}return {d,v:sum/(e.length||1)+m.gain*.15}}).sort((a,b)=>b.v-a.v)}function render(){document.documentElement.lang=lang;$('lang').value=lang;['title','new','undo','hint','analysis'].forEach((id,i)=>$(id).textContent=t()[i]);$('auto').textContent=t()[timer?6:5];$('score').textContent=t()[7]+': '+score;$('best').textContent=t()[8]+': '+best;$('board').replaceChildren(...b.map(v=>{let el=document.createElement('div');el.className='tile';el.textContent=v||'';el.style.background=v?'hsl('+Math.max(28,100-Math.log2(v)*7)+' 65% '+Math.max(48,94-Math.log2(v)*4)+'%)':'#49745a';return el}));localStorage.setItem('game2048',JSON.stringify({b,score,won}));localStorage.setItem('best2048',best)}function stop(){clearInterval(timer);timer=null;render()}function play(d){let m=move(b,d);if(!m.changed)return;history.push({b:b.slice(),score,won});b=m.n;score+=m.gain;best=Math.max(best,score);spawn(b);$('status').textContent='';if(!won&&b.includes(2048)){won=true;$('status').textContent=t()[10]}if(![0,1,2,3].some(k=>move(b,k).changed)){stop();$('status').textContent=t()[9]}render()}function fresh(){stop();b=Array(16).fill(0);score=0;won=false;history=[];spawn(b);spawn(b);$('status').textContent='';render()}function close(){$('menu').hidden=true}$('toggle').onclick=()=>$('menu').hidden=!$('menu').hidden;$('new').onclick=()=>{fresh();close()};$('undo').onclick=()=>{stop();let h=history.pop();if(h){b=h.b;score=h.score;won=h.won;render()}$('status').textContent='';close()};$('hint').onclick=()=>{let r=rank()[0];$('status').textContent=Number.isFinite(r.v)?t()[11+r.d]:t()[9];close()};$('analysis').onclick=()=>{$('status').textContent=rank().filter(r=>Number.isFinite(r.v)).map(r=>t()[11+r.d]+': '+Math.round(r.v)).join(' · ')||t()[9];close()};$('auto').onclick=()=>{if(timer)stop();else{timer=setInterval(()=>{let r=rank()[0];if(Number.isFinite(r.v))play(r.d);else stop()},350);render()}close()};$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('lang',lang);$('status').textContent='';render();close()};document.addEventListener('keydown',e=>{let d=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key);if(d>=0){e.preventDefault();stop();play(d)}});let start=null;$('board').onpointerdown=e=>{start=[e.clientX,e.clientY];$('board').setPointerCapture(e.pointerId)};$('board').onpointercancel=()=>start=null;$('board').onpointerup=e=>{if(!start)return;let x=e.clientX-start[0],y=e.clientY-start[1];start=null;if(Math.max(Math.abs(x),Math.abs(y))<18)return;stop();play(Math.abs(x)>Math.abs(y)?x>0?1:3:y>0?2:0)};try{let s=JSON.parse(localStorage.getItem('game2048'));if(s&&Array.isArray(s.b)&&s.b.length===16){b=s.b;score=s.score;won=s.won;render()}else fresh()}catch{fresh()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
